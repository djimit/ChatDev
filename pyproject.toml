[build-system]
requires = ["setuptools>=69.0.2", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatdev"
version = "1.0.0"
description = "Multi-agent framework for automated software development using Large Language Models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "CAMEL-AI.org", email = "contact@camel-ai.org"}
]
keywords = [
    "artificial-intelligence",
    "multi-agent",
    "software-development",
    "llm",
    "openai",
    "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "colorama>=0.4.6",
    "Flask>=3.0.0",
    "Flask-SocketIO>=5.3.4",
    "importlib-metadata>=6.8.0",
    "numpy>=1.24.3,<2.0.0",
    "openai>=1.0.0,<2.0.0",
    "regex>=2023.6.3",
    "requests>=2.31.0",
    "tenacity>=8.2.2",
    "tiktoken>=0.5.0",
    "virtualenv>=20.23.0",
    "Werkzeug>=3.0.0",
    "Markdown>=3.4.4",
    "Pillow>=10.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "pre-commit>=3.6.0",
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenBMB/ChatDev"
Documentation = "https://github.com/OpenBMB/ChatDev/wiki"
Repository = "https://github.com/OpenBMB/ChatDev"
"Bug Tracker" = "https://github.com/OpenBMB/ChatDev/issues"

[project.scripts]
chatdev = "run:main"

[tool.setuptools]
packages = ["chatdev", "camel"]

[tool.setuptools.package-data]
chatdev = ["py.typed"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | WareHouse
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["WareHouse/*", "*/migrations/*"]

# mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when all code is typed
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=chatdev",
    "--cov=camel",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=50",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "requires_api: Tests requiring API access",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# coverage configuration
[tool.coverage.run]
source = ["chatdev", "camel"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/WareHouse/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# bandit configuration (security linting)
[tool.bandit]
exclude_dirs = [
    "tests",
    "WareHouse",
    ".venv",
    "venv"
]
skips = [
    "B101",  # Skip assert_used check (needed for tests)
]

# pylint configuration
[tool.pylint.main]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access (sometimes needed for testing)
]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "f"]

[tool.pylint.design]
max-args = 10
max-attributes = 15

# flake8 configuration (in .flake8 file as it doesn't support pyproject.toml)
