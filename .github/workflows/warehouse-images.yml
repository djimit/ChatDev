name: Warehouse image compatibility
on:
  pull_request:
    paths:
      - 'WareHouse/**'
      - 'requirements.txt'
      - 'tests/test_warehouse_pillow.py'
      - '.github/workflows/warehouse-images.yml'
  push:
    branches: [main]
    paths:
      - 'WareHouse/**'
      - 'requirements.txt'
      - 'tests/test_warehouse_pillow.py'
      - '.github/workflows/warehouse-images.yml'
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==13.0.0
      - run: python tests/test_warehouse_pillow.py
